<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#0a0d12;--bg2:#0e1218;--card:#12171f;--card2:#182029;--line:#1f2733;--line2:#2b3544;
 --tx:#e8edf5;--tx2:#9ba7b8;--tx3:#646e7d;
 --s:#3ddc97;--a:#5aa9ff;--b:#f5c451;--c:#ff7a6b;--p:#b48ef7;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;
 font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 display:flex;flex-direction:column;letter-spacing:.005em}

/* ---------- 顶栏 ---------- */
.top{flex:none;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101620,#0b0f15);padding:11px 18px 10px}
.t1{display:flex;align-items:baseline;gap:12px;margin-bottom:9px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.01em}
.logo em{font-style:normal;color:var(--s)}
.tsub{font-size:11.5px;color:var(--tx3)}
.t1 .sp{flex:1}
.ptags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.ptags span{font-size:10px;color:#7c8798;border:1px solid #232c39;background:#111721;
 padding:1px 7px;border-radius:999px;white-space:nowrap}
.kpi{display:flex;gap:16px}
.kpi div{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.kpi b{color:var(--tx);font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;margin-right:2px}
.kpi b.g{color:var(--s)}

.t2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--tx);
 border-radius:9px;padding:8px 12px 8px 32px;font-size:12.5px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--s);box-shadow:0 0 0 3px rgba(61,220,151,.09)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex:none}
.seg button{background:var(--card);border:0;border-right:1px solid var(--line);color:var(--tx2);
 font-size:11.5px;padding:7px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--tx);background:var(--card2)}
.seg button.on{background:var(--s);color:#06210f;font-weight:700}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.cl{font-size:11px;color:var(--tx3);margin-right:2px;min-width:32px}
.chip{background:transparent;border:1px solid var(--line2);color:var(--tx2);border-radius:999px;
 padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
.chip:hover{border-color:#3d4b60;color:var(--tx)}
.chip.on{background:rgba(61,220,151,.14);border-color:var(--s);color:var(--s);font-weight:650}
.chip.on.hn,.chip.hn.on{background:rgba(180,142,247,.18);border-color:var(--p);color:var(--p)}

/* ---------- 三栏 ---------- */
.app{flex:1;display:grid;grid-template-columns:158px 176px 1fr;overflow:hidden;min-height:0}
.col{overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);padding:8px 7px}
.col::-webkit-scrollbar{width:7px}
.col::-webkit-scrollbar-thumb{background:#2b3544;border-radius:4px}
.col::-webkit-scrollbar-track{background:transparent}
.chd{font-size:10px;letter-spacing:.13em;color:var(--tx3);padding:4px 8px 7px;text-transform:uppercase;
 position:sticky;top:-8px;background:var(--bg);z-index:2;margin:-8px -7px 4px;padding-left:15px}

.pitem{display:flex;align-items:center;justify-content:space-between;gap:6px;
 padding:6px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--tx2);transition:.1s}
.pitem:hover{background:var(--card2);color:var(--tx)}
.pitem.on{background:rgba(61,220,151,.13);color:var(--s);font-weight:650}
.pitem.hn{color:#c9adf8}
.pitem.hn.on{background:rgba(180,142,247,.16);color:var(--p)}
.pitem.dim{opacity:.32}
.pitem .n{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.pitem.on .n{color:inherit;opacity:.7}
.pitem .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 列表 ---------- */
.list{padding:0;border-right:0;background:var(--bg)}
.lhd{position:sticky;top:0;z-index:5;background:rgba(10,13,18,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
.lhd .t{font-size:12.5px;color:var(--tx2)}
.lhd .t b{color:var(--tx);font-weight:700}
.lhd .t s{text-decoration:none;color:var(--tx3);margin:0 5px}
.legend{display:flex;gap:11px;font-size:10.5px;color:var(--tx3);align-items:center}
.legend i{font-style:normal;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%}

.row{display:grid;grid-template-columns:66px 1fr 92px;gap:12px;padding:10px 14px;
 border-bottom:1px solid var(--line);cursor:pointer;transition:.1s;position:relative;align-items:center}
.row:hover{background:var(--card)}
.row:active{background:var(--card2)}
.row.sel{background:rgba(61,220,151,.07)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--s)}
.rl{text-align:center}
.rl .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.rl .u{font-size:9px;color:var(--tx3);letter-spacing:.05em}
.t-s .rl .v{color:var(--s)}.t-a .rl .v{color:var(--a)}
.t-b .rl .v{color:var(--b)}.t-c .rl .v{color:var(--c)}

.rm{min-width:0}
.rm .n1{font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .n1 span{color:var(--tx2);font-weight:400}
.rm .n2{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rm .n2 .cd{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#55606f}
.tg{font-size:9.5px;padding:1px 6px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.tg.g{background:rgba(61,220,151,.1);color:#6fe5b0;border-color:rgba(61,220,151,.2)}
.tg.o{background:rgba(245,196,81,.1);color:#f2ce7c;border-color:rgba(245,196,81,.2)}
.tg.n{background:rgba(90,169,255,.09);color:#8cc4ff;border-color:rgba(90,169,255,.18)}
.tg.d{background:#171d27;color:var(--tx3);border-color:var(--line2)}

.rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rr .sc{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}
.rr .sk{font-size:9.5px;color:var(--tx3)}
.spark{opacity:.85}

.empty{padding:60px 20px;text-align:center;color:var(--tx3);font-size:12.5px}
.empty b{display:block;color:var(--tx2);font-size:14px;margin-bottom:5px}

.mob{display:none}
@media(max-width:880px){
 .app{grid-template-columns:1fr}
 #cp,#cc{display:none}
 .mob{display:flex;gap:6px;margin-top:8px}
 .mob select{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--tx);
  border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit}
 .row{grid-template-columns:56px 1fr}
 .rr{grid-column:1/-1;flex-direction:row;justify-content:flex-end;gap:10px}
}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
 transition:.22s;z-index:60;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:94vw;background:#0c1016;
 border-left:1px solid var(--line2);z-index:61;transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
 display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.55)}
.dw.on{transform:translateX(0)}
.dhh{flex:none;padding:14px 18px 12px;border-bottom:1px solid var(--line);
 background:linear-gradient(180deg,#131a24,#0d1219);position:relative}
.dhh .x{position:absolute;right:14px;top:12px;background:var(--card2);border:1px solid var(--line2);
 color:var(--tx2);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:15px;line-height:1;font-family:inherit}
.dhh .x:hover{color:var(--tx);border-color:#3d4b60}
.dhh .lv{font-size:10.5px;color:var(--tx3);letter-spacing:.08em;margin-bottom:5px}
.dhh h2{font-size:16px;font-weight:750;line-height:1.35;padding-right:30px}
.dhh h2 span{color:var(--tx2);font-weight:400;font-size:14px}
.dhh .sub{font-size:11.5px;color:var(--tx3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.dhh .sub .cd{font-family:ui-monospace,Consolas,monospace;cursor:pointer;border-bottom:1px dashed #3a4658}
.dhh .sub .cd:hover{color:var(--s);border-color:var(--s)}

.dwb{flex:1;overflow-y:auto;padding:16px 18px 40px}
.dwb::-webkit-scrollbar{width:8px}
.dwb::-webkit-scrollbar-thumb{background:#2b3544;border-radius:4px}

.mcard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.mcard div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mcard .k{font-size:10px;color:var(--tx3);margin-bottom:2px}
.mcard .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mcard .v small{font-size:10.5px;font-weight:600;color:var(--tx3);margin-left:1px}

.sec{margin-bottom:18px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sh h3{font-size:12.5px;font-weight:700;letter-spacing:.02em}
.sh .ln{flex:1;height:1px;background:var(--line)}
.sh .tag2{font-size:10px;color:var(--tx3);border:1px solid var(--line2);padding:1px 7px;border-radius:999px}
.sh .tag2.hot{color:var(--p);border-color:rgba(180,142,247,.4)}

.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.box.pad0{padding:6px 8px 8px}

.bars{display:flex;align-items:flex-end;gap:14px;height:112px;padding:14px 8px 0}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bcol .bv{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:3px;color:var(--tx2)}
.bcol .bar{width:100%;max-width:38px;border-radius:3px 3px 1px 1px;background:#31404f;transition:height .3s;min-height:2px}
.bcol .bar.s{background:linear-gradient(180deg,#3ddc97,#1f9e6b)}
.bcol .bar.a{background:linear-gradient(180deg,#5aa9ff,#2f6db5)}
.bcol .bar.b{background:linear-gradient(180deg,#f5c451,#a8832b)}
.bcol .bar.c{background:linear-gradient(180deg,#ff7a6b,#a83f34)}
.bcol .bar.na{background:repeating-linear-gradient(45deg,#1b222c,#1b222c 4px,#141a22 4px,#141a22 8px)}
.bcol .by{font-size:10px;color:var(--tx3);margin-top:5px}
.bcol .bh{font-size:9px;color:#4d5766;margin-top:1px}
.bcol.cur .by{color:var(--s);font-weight:700}

.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ci{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.ci .ic{width:15px;height:15px;flex:none;border-radius:50%;font-size:9.5px;font-weight:800;
 display:flex;align-items:center;justify-content:center;margin-top:1px}
.ci .ic.ok{background:rgba(61,220,151,.16);color:var(--s)}
.ci .ic.warn{background:rgba(245,196,81,.16);color:var(--b)}
.ci .ic.no{background:rgba(255,122,107,.16);color:var(--c)}
.ci .tx{min-width:0}
.ci .l{font-size:10px;color:var(--tx3);line-height:1.3}
.ci .v{font-size:11.5px;color:#cbd5e2;line-height:1.45;word-break:break-word}

.fld2{margin-bottom:10px}
.fld2 .l{font-size:10px;color:var(--tx3);margin-bottom:3px}
.fld2 .c{font-size:12px;color:#c3cddb;line-height:1.65;word-break:break-word}

.pr{display:flex;align-items:center;gap:9px;padding:5px 2px}
.pr .nm{flex:1;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .tr{width:110px;height:6px;background:#1c242f;border-radius:3px;overflow:hidden;flex:none}
.pr .tr i{display:block;height:100%;border-radius:3px}
.pr .vv{width:44px;text-align:right;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.pr.cur{background:rgba(61,220,151,.08);border-radius:6px}
.pr.cur .nm{color:var(--s);font-weight:650}

.dscore{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.dscore input[type=range]{flex:1;accent-color:#3ddc97;height:4px}
.dscore .sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--s);width:52px;text-align:right}
.dscore .lb2{font-size:10.5px;color:var(--tx3)}

.adv{font-size:12px;color:#b9c4d3;line-height:1.85;background:linear-gradient(135deg,rgba(61,220,151,.06),rgba(90,169,255,.04));
 border:1px solid rgba(61,220,151,.18);border-radius:10px;padding:12px 14px}
.adv b{color:var(--tx);font-weight:700}
.adv .hl{color:var(--s);font-weight:700}
.adv .wn{color:var(--b);font-weight:650}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--card2);border:1px solid var(--line2);color:var(--tx2);border-radius:8px;
 padding:6px 12px;font-size:11.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--s);color:var(--s)}
.btn.star.on{border-color:var(--b);color:var(--b);background:rgba(245,196,81,.1)}
</style>
</head>
<body>

<div class="top">
  <div class="t1">
    <div class="logo">__YEAR__ 国考 · 岗位<em>筛选器</em></div>
    <div class="tsub">__SUBTITLE__</div>
    <div class="sp"></div>
    <div class="ptags" id="ptags">__TAGS__</div>
    <div class="kpi">
      <div><b id="k1">—</b>个岗位</div>
      <div><b id="k2">—</b>人</div>
      <div><b id="k3" class="g">—</b>中位竞争比</div>
      <div><b id="k4">—</b>中位进面</div>
    </div>
  </div>
  <div class="t2">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="搜单位 / 岗位 / 市县 / 专业 / 备注…">
    </div>
    <div class="seg" id="sort">
      <button data-s="ratio" class="on">竞争比</button>
      <button data-s="score">进面线</button>
      <button data-s="hire">招录人</button>
      <button data-s="star">我的备选</button>
    </div>
  </div>
  <div class="chips">
    <span class="cl">竞争比</span>
    <button class="chip on" data-r="all">不限</button>
    <button class="chip" data-r="10">≤10</button>
    <button class="chip" data-r="20">≤20</button>
    <button class="chip" data-r="35">≤35</button>
    <button class="chip" data-r="60">≤60</button>
    <button class="chip" data-r="100">≤100</button>
    <span class="cl" style="margin-left:8px">条件</span>
    <button class="chip" data-t="svc">无服务期</button>
    <button class="chip" data-t="big">招2人+</button>
    <button class="chip" data-t="pct">仅200分制</button>
    <button class="chip" data-t="conf">仅A/B级</button>
    <button class="chip" data-t="noq">不看限女</button>
  </div>
  <div class="mob">
    <select id="msel"><option value="">全部省份</option></select>
    <select id="mcit"><option value="">全部城市</option></select>
  </div>
</div>

<div class="app">
  <aside class="col" id="cp"></aside>
  <aside class="col" id="cc"></aside>
  <main class="col list" id="cl"></main>
</div>

<div class="mask" id="mask"></div>
<aside class="dw" id="dw">
  <div class="dhh">
    <button class="x" id="dwx">×</button>
    <div class="lv" id="dwlv"></div>
    <h2 id="dwt"></h2>
    <div class="sub" id="dws"></div>
  </div>
  <div class="dwb" id="dwb"></div>
</aside>

<script>
const D = __DATA__;
const HN = "__HOME_PROV__";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v>=100?Math.round(v):(v>=10?v.toFixed(0):v.toFixed(1));
const tier = r => r<15?"s":r<40?"a":r<100?"b":"c";
const TC = {s:"#3ddc97",a:"#5aa9ff",b:"#f5c451",c:"#ff7a6b"};

const S = { q:"", prov:"", city:"", rat:"all", togs:new Set(), sort:"ratio", myScore:120 };
let STARS = new Set();
try{ STARS = new Set(JSON.parse(localStorage.getItem("gk2027_star")||"[]")); }catch(e){}
const saveStars = ()=>{ try{ localStorage.setItem("gk2027_star", JSON.stringify([...STARS])); }catch(e){} };
const keyOf = r => r.code+"|"+r.u;

// ---------- 静态索引 ----------
const cityIdx = new Map();   // "prov|city" -> rows
D.forEach(r=>{
  const k = r.prov+"|"+r.city;
  if(!cityIdx.has(k)) cityIdx.set(k, []);
  cityIdx.get(k).push(r);
});

// ---------- 筛选 ----------
function baseMatch(r){
  if(S.rat!=="all" && r.ratio > +S.rat) return false;
  if(S.togs.has("svc") && r.svc) return false;
  if(S.togs.has("big") && r.hire<2) return false;
  if(S.togs.has("pct") && r.pct) return false;
  if(S.togs.has("conf") && !(r.conf==="A"||r.conf==="B")) return false;
  if(S.togs.has("noq") && /女性|限女/.test(r.rmk||"")) return false;
  if(S.sort==="star" && !STARS.has(keyOf(r))) return false;
  if(S.q){
    const h = (r.u+" "+r.p+" "+r.pl+" "+r.city+" "+r.cty+" "+r.pro+" "+r.rmk+" "+r.prov).toLowerCase();
    if(!h.includes(S.q)) return false;
  }
  return true;
}
function sortFn(a,b){
  if(S.sort==="score") return (a.pct?1:0)-(b.pct?1:0) || a.score-b.score;
  if(S.sort==="hire") return b.hire-a.hire || a.ratio-b.ratio;
  return a.ratio-b.ratio || b.hire-a.hire;
}

let BASE = [], VIEW = [];
function compute(){
  BASE = D.filter(baseMatch);
  // 省份计数
  const pc = new Map();
  BASE.forEach(r=>pc.set(r.prov,(pc.get(r.prov)||0)+1));
  renderProvs(pc);
  // 当前省若已不在候选中，清掉
  if(S.prov && !pc.has(S.prov)) S.prov="";
  const byProv = S.prov ? BASE.filter(r=>r.prov===S.prov) : BASE;
  const cc = new Map();
  byProv.forEach(r=>cc.set(r.city,(cc.get(r.city)||0)+1));
  renderCities(cc);
  if(S.city && !cc.has(S.city)) S.city="";
  VIEW = (S.city ? byProv.filter(r=>r.city===S.city) : byProv).sort(sortFn);
  renderList();
  renderKPI();
  syncSelects(pc,cc);
}

function renderProvs(pc){
  const arr = [...pc.entries()].sort((a,b)=>{
    if(a[0]===HN) return -1; if(b[0]===HN) return 1;
    return b[1]-a[1];
  });
  let h = '<div class="chd">省份 / '+pc.size+'</div>';
  h += `<div class="pitem${S.prov===""?" on":""}" data-p=""><span class="tx">全部省份</span><span class="n">${BASE.length}</span></div>`;
  arr.forEach(([p,n])=>{
    h += `<div class="pitem${S.prov===p?" on":""}${p===HN?" hn":""}" data-p="${esc(p)}">
      <span class="tx">${esc(p)}</span><span class="n">${n}</span></div>`;
  });
  $("#cp").innerHTML = h;
}
function renderCities(cc){
  if(!S.prov){
    $("#cc").innerHTML = '<div class="chd">城市</div><div style="padding:20px 10px;color:var(--tx3);font-size:11.5px;line-height:1.7">← 先选省份<br><span style="color:#4d5766">全国 208 个地市</span></div>';
    return;
  }
  const arr = [...cc.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],"zh"));
  let h = `<div class="chd">${esc(S.prov)} · ${cc.size} 市</div>`;
  h += `<div class="pitem${S.city===""?" on":""}" data-c=""><span class="tx">全部城市</span><span class="n">${arr.reduce((s,x)=>s+x[1],0)}</span></div>`;
  arr.forEach(([c,n])=>{
    h += `<div class="pitem${S.city===c?" on":""}" data-c="${esc(c)}"><span class="tx">${esc(c)}</span><span class="n">${n}</span></div>`;
  });
  $("#cc").innerHTML = h;
}

function spark(r){
  const h = r.h;
  if(!h.length) return "";
  const W=52,H=18, mx=Math.max(...h.map(x=>x[1]),1);
  const pts = h.map((x,i)=>{
    const px = 3 + (W-6)*(i/Math.max(1,h.length-1));
    const py = H-3 - (H-6)*(Math.log1p(x[1])/Math.log1p(mx));
    return px.toFixed(1)+","+py.toFixed(1);
  }).join(" ");
  const last = h[h.length-1][1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${pts}" fill="none" stroke="${TC[tier(last)]}" stroke-width="1.4" opacity="0.9"/></svg>`;
}

function renderList(){
  const t = $("#cl");
  if(!VIEW.length){
    t.innerHTML = '<div class="lhd"><div class="t">没有符合条件的岗位</div></div><div class="empty"><b>换个省或放宽条件</b>试试取消"无服务期"或提高竞争比上限</div>';
    return;
  }
  const title = S.city ? `${S.prov} · ${S.city}` : (S.prov ? S.prov + " 全省" : "全国");
  const sh = VIEW.reduce((s,r)=>s+r.hire,0);
  const med = VIEW.map(r=>r.ratio).sort((a,b)=>a-b)[Math.floor(VIEW.length/2)];
  let h = `<div class="lhd">
    <div class="t"><b>${esc(title)}</b><s>|</s>${VIEW.length} 个岗位<s>·</s>招 ${sh} 人<s>·</s>中位 ${fmt(med)}:1</div>
    <div class="legend">
      <i><span class="dot" style="background:var(--s)"></span>&lt;15</i>
      <i><span class="dot" style="background:var(--a)"></span>15-40</i>
      <i><span class="dot" style="background:var(--b)"></span>40-100</i>
      <i><span class="dot" style="background:var(--c)"></span>&gt;100</i>
    </div></div>`;
  VIEW.forEach((r,i)=>{
    const tr = tier(r.ratio), st = STARS.has(keyOf(r));
    const tags = [];
    if(r.prov===HN) tags.push('<span class="tg n">河南</span>');
    if(!r.svc) tags.push('<span class="tg g">无服务期</span>');
    if(r.hire>=3) tags.push('<span class="tg g">招'+r.hire+'</span>');
    if(r.pct) tags.push('<span class="tg o">百分制</span>');
    if(r.cet4) tags.push('<span class="tg o">四级</span>');
    if(r.stale) tags.push('<span class="tg o">历史口径变</span>');
    if(r.conf==="R" && r.N>0) tags.push('<span class="tg g">实测'+r.N+'人</span>');
    if(!r.h.length) tags.push('<span class="tg d">无历史</span>');
    else if(r.h.length>=3) tags.push('<span class="tg d">'+r.h.length+'年</span>');
    h += `<div class="row t-${tr}${st?" sel":""}" data-i="${i}">
      <div class="rl"><div class="v">${fmt(r.ratio)}</div><div class="u">: 1</div></div>
      <div class="rm">
        <div class="n1">${esc(r.u.replace("国家税务总局",""))} <span>${esc(r.p)}</span></div>
        <div class="n2">
          <span>${esc(r.city)}${r.cty?" "+esc(r.cty):""}</span>
          <span>招 ${r.hire} · 进面 ${r.adv}</span>
          ${tags.join("")}
          <span class="cd">${esc(r.dept)}·${esc(r.code)}</span>
        </div>
      </div>
      <div class="rr">
        <div class="sc">${r.pct?"≈":""}${r.score.toFixed(1)}</div>
        <div class="sk">预估进面</div>
        ${spark(r)}
      </div>
    </div>`;
  });
  t.innerHTML = h;
}

function renderKPI(){
  const sh = VIEW.reduce((s,r)=>s+r.hire,0);
  const rs = VIEW.map(r=>r.ratio).sort((a,b)=>a-b);
  const ss = VIEW.filter(r=>!r.pct).map(r=>r.score).sort((a,b)=>a-b);
  $("#k1").textContent = VIEW.length;
  $("#k2").textContent = sh;
  $("#k3").textContent = rs.length?fmt(rs[Math.floor(rs.length/2)]):"—";
  $("#k4").textContent = ss.length?ss[Math.floor(ss.length/2)].toFixed(1):"—";
}

function drawerBody(r){
  const tr = tier(r.ratio), st = STARS.has(keyOf(r));
  const med = r.hsa;
  let h = "";

  // 指标卡
  const real = r.conf==="R" && r.N>0;
  const rd = real ? (String(r.src).match(/(\d{1,2}\/\d{1,2})/)||[])[1] || "" : "";
  h += `<div class="mcard">
    <div><div class="k">预测竞争比</div><div class="v" style="color:${TC[tr]}">${fmt(r.ratio)}<small>:1</small></div></div>
    <div><div class="k">招录 / 进面</div><div class="v">${r.hire}<small>人</small> / ${r.adv}<small>人</small></div></div>
    <div style="${real?"border-color:#3ddc97;box-shadow:inset 0 0 0 1px #3ddc97":""}"><div class="k" style="${real?"color:#3ddc97":""}">${real?"实际报名"+(rd?" · "+rd:""):"预测报名"}</div><div class="v" style="${real?"color:#3ddc97":""}">${fmt(r.N)}<small>人</small></div></div>
    <div><div class="k">预估进面线</div><div class="v">${r.pct?"≈":""}${r.score.toFixed(1)}</div></div>
  </div>`;

  // 五年竞争比
  h += `<div class="sec"><div class="sh"><h3>近五年竞争比</h3><span class="ln"></span>
    <span class="tag2${r.stale?" hot":""}">${r.stale?"历史口径已变":"柱高=报名÷招录"}</span></div>
    <div class="box pad0">${chartHist(r)}</div></div>`;

  // 河南进面线
  if(r.hs && Object.keys(r.hs).length)
    h += `<div class="sec"><div class="sh"><h3>河南历年真实进面线</h3><span class="ln"></span>
      <span class="tag2 hot">实测值 · 非估算</span></div>
      <div class="box pad0">${chartHen(r)}</div></div>`;

  // 分数-概率
  h += `<div class="sec"><div class="sh"><h3>你的分数 → 进面概率</h3><span class="ln"></span>
    <span class="tag2">拖滑块试</span></div>
    <div class="box">
      <div class="dscore">
        <span class="lb2">估分</span>
        <input type="range" id="sld" min="105" max="145" step="0.5" value="${S.myScore}">
        <span class="sv" id="sv">${S.myScore}</span>
      </div>
      <div id="pbox"></div>
    </div></div>`;

  // 条件清单
  h += `<div class="sec"><div class="sh"><h3>报考条件逐条核对</h3><span class="ln"></span>
    <span class="tag2">按你的档案判定</span></div>
    <div class="chk">${r.ck.map(c=>{
      const [ic,l,v]=c;
      return `<div class="ci"><div class="ic ${ic}">${ic==="ok"?"✓":ic==="warn"?"!":"✕"}</div>
        <div class="tx"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div></div>`;
    }).join("")}</div></div>`;

  // 同市对比
  const sib = (cityIdx.get(r.prov+"|"+r.city)||[]).slice().sort((a,b)=>a.ratio-b.ratio);
  if(sib.length>1){
    const mx = Math.max(...sib.map(x=>x.ratio));
    h += `<div class="sec"><div class="sh"><h3>同市其他可报岗位</h3><span class="ln"></span>
      <span class="tag2">${esc(r.city)} 共 ${sib.length} 个</span></div>
      <div class="box">${sib.map(x=>{
        const cur = x===r;
        return `<div class="pr${cur?" cur":""}">
          <div class="nm">${esc(x.u.replace("国家税务总局",""))} ${esc(x.p.replace("一级行政执法员",""))}</div>
          <div class="tr"><i style="width:${Math.max(3,(x.ratio/mx)*100)}%;background:${TC[tier(x.ratio)]}"></i></div>
          <div class="vv" style="color:${TC[tier(x.ratio)]}">${fmt(x.ratio)}</div></div>`;
      }).join("")}</div></div>`;
  }

  // 原文
  h += `<div class="sec"><div class="sh"><h3>职位表原文</h3><span class="ln"></span></div>
    <div class="box">
      <div class="fld2"><div class="l">专业</div><div class="c">${esc(r.pro)}</div></div>
      <div class="fld2"><div class="l">备注</div><div class="c">${esc(r.rmk)||'<span style="color:var(--tx3)">（无备注，条件最干净）</span>'}</div></div>
      <div class="fld2"><div class="l">工作地点 / 落户地点</div><div class="c">${esc(r.loc)} · ${esc(r.luo)}</div></div>
      <div class="fld2" style="margin-bottom:0"><div class="l">推算依据</div><div class="c">${esc(r.src)}　<b style="color:var(--tx)">${r.conf} 级</b></div></div>
    </div></div>`;

  // 建议
  h += `<div class="adv">${advice(r)}</div>`;
  h += `<div class="btnrow">
    <button class="btn star${st?" on":""}" id="bstar">${st?"★ 已在备选":"☆ 加入备选"}</button>
    <button class="btn" data-cp="${esc(r.dept)}">复制部门代码</button>
    <button class="btn" data-cp="${esc(r.code)}">复制职位代码</button>
  </div>`;
  return h;
}

// ---------- 图 1：五年柱 ----------
function chartHist(r){
  const YEARS=[2022,2023,2024,2025,2026];
  const map = new Map(r.h.map(x=>[x[0],x]));
  const mx = Math.max(1, ...r.h.map(x=>x[1]));
  let h = '<div class="bars">';
  YEARS.forEach(y=>{
    const d = map.get(y);
    if(!d){
      h += `<div class="bcol"><div class="bv" style="color:#4d5766">—</div>
        <div class="bar na" style="height:16px"></div><div class="by">${y}</div><div class="bh">无数据</div></div>`;
      return;
    }
    const [_,ratio,hire,apply,exact] = d;
    const pctv = Math.max(6, (Math.log1p(ratio)/Math.log1p(mx))*100);
    h += `<div class="bcol${y===2026?" cur":""}">
      <div class="bv" style="color:${TC[tier(ratio)]}">${fmt(ratio)}</div>
      <div class="bar ${tier(ratio)}" style="height:${pctv}%"></div>
      <div class="by">${y}</div>
      <div class="bh">${apply}报/${hire}招${exact?"":"*"}</div></div>`;
  });
  h += '</div><div style="font-size:10px;color:#4d5766;padding:6px 10px 2px">* 表示按去序号岗位名近似匹配；柱高取对数刻度，否则大年会把小年压平</div>';
  return h;
}

// ---------- 图 2：河南进面线 ----------
function chartHen(r){
  const ys = Object.keys(r.hs).map(Number).sort();
  const vals = ys.map(y=>r.hs[y]);
  const mn = Math.min(...vals)-3, mx = Math.max(...vals)+3;
  const W=520,H=118,PL=34,PR=12,PT=16,PB=22;
  const iw=W-PL-PR, ih=H-PT-PB;
  const X = i => PL + (ys.length>1 ? iw*i/(ys.length-1) : iw/2);
  const Y = v => PT + ih*(1-(v-mn)/(mx-mn));
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <g font-size="9" fill="#5c6675">`;
  [mn, (mn+mx)/2, mx].forEach(v=>{
    s += `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="#1e2733"/>
          <text x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(0)}</text>`;
  });
  s += `</g><polyline points="${ys.map((y,i)=>X(i).toFixed(1)+","+Y(r.hs[y]).toFixed(1)).join(" ")}"
      fill="none" stroke="#b48ef7" stroke-width="2"/>`;
  ys.forEach((y,i)=>{
    const v = r.hs[y];
    s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="#0c1016" stroke="#b48ef7" stroke-width="2"/>`;
    s += `<text x="${X(i).toFixed(1)}" y="${(Y(v)-9).toFixed(1)}" fill="#d3c2f8" font-size="10" font-weight="700" text-anchor="middle">${v.toFixed(1)}</text>`;
    s += `<text x="${X(i).toFixed(1)}" y="${H-6}" fill="#5c6675" font-size="9.5" text-anchor="middle">${y}</text>`;
  });
  return s+'</svg>';
}

// ---------- 图 3：分数→概率 ----------
function Phi(x){
  const t = 1/(1+0.2316419*Math.abs(x));
  const d = 0.3989423*Math.exp(-x*x/2);
  const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0 ? 1-p : p;
}
function probAt(r, s){
  const L = 103.21 + 5.53*Math.log(Math.max(r.ratio,1.5));
  return Phi((s - L)/10.9);
}
function drawProb(r){
  const W=534,H=150,PL=30,PR=10,PT=12,PB=24;
  const iw=W-PL-PR, ih=H-PT-PB;
  const X = s => PL + iw*(s-105)/(145-105);
  const Y = p => PT + ih*(1-p);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [0,.25,.5,.75,1].forEach(p=>{
    s += `<line x1="${PL}" y1="${Y(p).toFixed(1)}" x2="${W-PR}" y2="${Y(p).toFixed(1)}" stroke="#1e2733"/>
          <text x="${PL-5}" y="${(Y(p)+3).toFixed(1)}" font-size="9" fill="#5c6675" text-anchor="end">${p*100}%</text>`;
  });
  // 曲线
  let pts=[];
  for(let v=105;v<=145;v+=0.5) pts.push(`${X(v).toFixed(1)},${Y(probAt(r,v)).toFixed(1)}`);
  s += `<polyline points="${pts.join(" ")}" fill="none" stroke="#3ddc97" stroke-width="2.2"/>`;
  // 进面线竖线
  const L = 103.21 + 5.53*Math.log(Math.max(r.ratio,1.5));
  if(L>=105 && L<=145){
    s += `<line x1="${X(L).toFixed(1)}" y1="${PT}" x2="${X(L).toFixed(1)}" y2="${H-PB}" stroke="#5aa9ff" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`;
    s += `<text x="${(X(L)+4).toFixed(1)}" y="${PT+9}" font-size="9" fill="#5aa9ff">预估线 ${L.toFixed(0)}</text>`;
  }
  // 2026 实测
  if(r.hs && r.hs[2026]){
    const v=r.hs[2026];
    if(v>=105&&v<=145) s += `<line x1="${X(v).toFixed(1)}" y1="${PT}" x2="${X(v).toFixed(1)}" y2="${H-PB}" stroke="#b48ef7" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>`;
  }
  // 当前点
  const p0 = probAt(r, S.myScore);
  s += `<circle cx="${X(S.myScore).toFixed(1)}" cy="${Y(p0).toFixed(1)}" r="4.5" fill="#3ddc97"/>`;
  s += `<text x="${X(S.myScore).toFixed(1)}" y="${(Y(p0)-10).toFixed(1)}" font-size="11" font-weight="800" fill="#3ddc97" text-anchor="middle">${(p0*100).toFixed(0)}%</text>`;
  [110,120,130,140].forEach(v=>{
    s += `<text x="${X(v).toFixed(1)}" y="${H-7}" font-size="9" fill="#5c6675" text-anchor="middle">${v}</text>`;
  });
  s += `</svg>`;
  const box = $("#pbox");
  if(box) box.innerHTML = s + `<div style="font-size:11px;color:var(--tx3);margin-top:4px">
    按该岗预测竞争比 ${fmt(r.ratio)}:1 推算，进面线约 <b style="color:var(--tx2)">${L.toFixed(0)} 分</b>；
    你考 <b style="color:var(--s)">${S.myScore}</b> 分约有 <b style="color:var(--s)">${(p0*100).toFixed(0)}%</b> 概率进面。
    ${r.hs&&r.hs[2026]?`紫线是 2026 实际进面线 ${r.hs[2026]}。`:""}</div>`;
}

// ---------- 建议 ----------
function advice(r){
  const out = [];
  const t = tier(r.ratio);
  if(t==="s") out.push(`<b>这是全国最松的一档。</b>预测 ${fmt(r.ratio)}:1，招 ${r.hire} 进 ${r.adv}，正常发挥（<span class="hl">120 分</span>上下）进面把握很大。`);
  else if(t==="a") out.push(`<b>压力中等偏轻。</b>预测 ${fmt(r.ratio)}:1，建议按 <span class="hl">125 分</span>准备，进面有较大概率。`);
  else if(t==="b") out.push(`<b>竞争不算低。</b>预测 ${fmt(r.ratio)}:1，按 <span class="hl">130 分</span>准备才踏实，且建议同时盯一个更松的备选。`);
  else out.push(`<b class="wn">这个岗偏难。</b>预测 ${fmt(r.ratio)}:1，除非你估分 135+ 或者有本地情结，否则不建议作为主攻。`);

  if(r.stale) out.push(`历史数据里有"不限专业"年代的旧口径（该岗曾独占单位大部分报名），柱状图只能看趋势、不能看绝对值。`);

  if(r.h.length>=3){
    const v = r.h.map(x=>x[1]);
    const mx = Math.max(...v), mn = Math.min(...v);
    if(mx > mn*4) out.push(`<span class="wn">强烈的大小年</span>：历史最高 ${fmt(mx)}、最低 ${fmt(mn)}，差 ${(mx/mn).toFixed(0)} 倍。去年低不代表今年低，别按最低值赌。`);
    else out.push(`五年波动不大（${fmt(mn)}–${fmt(mx)}），这个岗的热度是结构性的，可预测性高。`);
  } else if(r.h.length) {
    out.push(`历史样本只有 ${r.h.length} 年，置信度 ${r.conf} 级，建议报名期核实实际人数。`);
  } else {
    out.push(`无同名历史数据，预测来自单位均分，误差较大，务必在报名中期看实际人数。`);
  }

  if(!r.svc) out.push(`<span class="hl">没有 5 年最低服务期</span>——这在税务系统里是少数，意味着以后还能遴选/调动。`);
  else out.push(`有 5 年最低服务期，5 年内不能调动、不能参加遴选，选之前想清楚。`);

  if(r.svc && r.hire===1) out.push(`招 1 人 + 锁 5 年，是这套组合里最被动的，慎重。`);
  if(r.hire>=3) out.push(`招 ${r.hire} 人（进面 ${r.adv} 人），容错空间比招 1 人的岗大得多。`);

  out.push(`报名期 <b>10 月 22–23 日</b>查一次实际报名数：超过 ${Math.round(r.ratio*2)} 人就考虑换，低于 ${Math.round(r.ratio*0.5)} 人可以放心报。`);
  return out.map(x=>"· "+x).join("<br>");
}

// ---------- 复制 ----------
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-cp]"); if(!t) return;
  e.stopPropagation();
  const txt = t.dataset.cp;
  const ok = ()=>{ const o=t.textContent; t.textContent="已复制"; setTimeout(()=>t.textContent=o,1100); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>fb(txt,ok));
  else fb(txt,ok);
});
function fb(txt,cb){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){}
  document.body.removeChild(ta);
}
// 滑块 & 星标（事件委托到抽屉）
$("#dwb").addEventListener("input", e=>{
  if(e.target.id==="sld"){
    S.myScore = +e.target.value;
    $("#sv").textContent = S.myScore;
    if(CUR) drawProb(CUR);
  }
});
$("#dwb").addEventListener("click", e=>{
  if(e.target.id==="bstar"){
    const k = keyOf(CUR);
    STARS.has(k) ? STARS.delete(k) : STARS.add(k);
    saveStars();
    e.target.classList.toggle("on", STARS.has(k));
    e.target.textContent = STARS.has(k) ? "★ 已在备选" : "☆ 加入备选";
    compute();
  }
});

compute();
</script>
